<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equity Language Commons Bluesky banner</title>
<!-- Google Fonts is render-time only here, same as scripts/og-card.html. Palette copied from site/src/styles/global.css. -->
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 3000px; height: 1000px; overflow: hidden; }
  body { background: #faf6ef; color: #22201c; position: relative; font-family: system-ui, -apple-system, sans-serif; }
  /* bsky.app crops top and bottom: keep everything inside roughly y 150-850; avatar overlaps bottom-left */
  .copy { position: absolute; left: 760px; top: 200px; }
  .kicker { font-size: 44px; letter-spacing: .15em; text-transform: uppercase; color: #8a857a; }
  h1 { margin: 24px 0 0; font-family: "Source Serif 4", Georgia, serif; font-weight: 400; font-size: 108px; line-height: 1.12; white-space: nowrap; letter-spacing: -1px; }
  h1 em { font-style: normal; color: #a84c2a; }
  .row { display: flex; align-items: center; gap: 28px; margin-top: 44px; }
  .term { font-family: "Source Serif 4", Georgia, serif; font-size: 76px; color: #a84c2a; margin-right: 12px; }
  .badge { padding: 16px 36px; border-radius: 6px; font-size: 42px; font-weight: 600; }
  .url { position: absolute; right: 140px; top: 660px; font-size: 48px; letter-spacing: .04em; color: #a84c2a; }
</style>
</head>
<body>
  <div class="copy">
    <div class="kicker">Equity Language Commons</div>
    <h1>Every guide says something different.<br><em>See them side by side.</em></h1>
    <div class="row">
      <span class="term">Latinx</span>
      <span class="badge" style="background:#e4ede0;color:#3a5a2e">Use</span>
      <span class="badge" style="background:#f5ead1;color:#7a5b15">Use with care</span>
      <span class="badge" style="background:#dfe7ef;color:#2d4c6b">Evolving</span>
    </div>
  </div>
  <div class="url">equitylanguagecommons.org</div>
</body>
</html>
